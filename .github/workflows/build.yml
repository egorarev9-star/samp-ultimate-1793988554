name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: LSRP
      uses: actions/upload-artifact@v4
      with:
        name: LSRP_210
        path: app/build/outputs/apk/debug/*.apk
